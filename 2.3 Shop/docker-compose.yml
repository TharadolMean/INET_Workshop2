services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - electrohub_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { rs.status().ok } catch (e) {
          rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}).ok }'
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/electrohub_v2?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGINS: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-ElectroHub Admin}
      DEMO_SEED_CONFIRM: ${DEMO_SEED_CONFIRM:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CUSTOMER_EMAIL: ${DEMO_CUSTOMER_EMAIL:-}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - electrohub_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/v1/products || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  electrohub_mongo_data:
  electrohub_uploads:
