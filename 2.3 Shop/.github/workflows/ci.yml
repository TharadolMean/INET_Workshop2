name: ElectroHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/electrohub_ci_test?replicaSet=rs0
      JWT_SECRET: ci-only-secret-with-at-least-32-characters-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Start local MongoDB replica set
        run: |
          docker run -d --name electrohub-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec electrohub-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec electrohub-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec electrohub-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo 'MongoDB replica set did not become primary' >&2
          exit 1
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend unit, integration and concurrency tests
        working-directory: backend
        run: npm test
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend component tests
        working-directory: frontend
        run: npm run test:unit -- --ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
